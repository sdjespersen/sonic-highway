{{- $c := site.Data.contact -}}
<section class="section section--accent" id="contact">
  <div class="contact">
    <div class="contact__info">
      <span class="section__num">04</span>
      <h2>{{ $c.heading }}</h2>
      {{- with $c.intro }}<p>{{ . }}</p>{{ end }}
      <dl class="contact__details">
        {{- with $c.email }}<dt>Email</dt><dd><a href="mailto:{{ . }}">{{ . }}</a></dd>{{ end }}
        {{- with $c.location }}<dt>Based in</dt><dd>{{ . }}</dd>{{ end }}
      </dl>
      {{- with $c.socials }}
      <ul class="socials">
        {{- range . }}<li><a href="{{ .url }}" target="_blank" rel="noopener">{{ .label }}</a></li>{{ end }}
      </ul>
      {{- end }}
    </div>
    <form class="form" name="contact" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" data-contact-form>
      <input type="hidden" name="form-name" value="contact">
      <p class="form__hp"><label>Leave this empty: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <label class="field"><span>Name</span><input name="name" required autocomplete="name"></label>
      <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
      <label class="field"><span>What's it about?</span>
        <select name="subject">
          <option>Booking</option>
          <option>Press</option>
          <option>Fan mail</option>
          <option>Something else</option>
        </select>
      </label>
      <label class="field"><span>Message</span><textarea name="message" rows="5" required></textarea></label>
      <button class="btn btn--dark" type="submit">Send message</button>
      <p class="form__status" role="status" aria-live="polite" data-success="{{ $c.success_message | default "Thanks! We'll be in touch." }}"></p>
    </form>
  </div>
</section>
